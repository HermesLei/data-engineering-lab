name: Python CI

on:
  push:
    branches:
      - dev
      - "feat/**"
      - "fix/**"
      - "chore/**"
      - "docs/**"
      - "refactor/**"
      - "test/**"
    tags: ["v*"]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-airflow.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-airflow.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: PYTHONPATH=src pytest -q

  airflow-image:
    name: Build image and validate Airflow DAGs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Airflow image
        run: docker build --file infrastructure/docker/airflow/Dockerfile --tag data-engineering-lab-airflow:ci .
      - name: Validate DAG imports
        run: docker run --rm --entrypoint python data-engineering-lab-airflow:ci /opt/airflow/scripts/validate_dags.py

  compose-config:
    name: Validate Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate local environment
        run: python scripts/bootstrap.py
      - name: Validate Compose file
        run: docker compose config --quiet
